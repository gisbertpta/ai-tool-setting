    #   # (declare them under top-level 'secrets:' below)
    #   secrets:
    #     - git-username
    #     - git-password

    # Volumes are merged with the generic ones (docker-compose.yml).
    # volumes:
    #   # Mask secrets (keep in sync with excluded-files):
    #   - /dev/null:/workspace/my-repo/.env:ro                                    # blank a file
    #   - ./project/dummies/my-repo/config:/workspace/my-repo/config:ro          # replace with a dummy
    #
    #   # Not needed: initialize.sh mounts this layer read-only by itself if it
    #   # lives outside .devcontainer/, and the working repos' .git/config + hooks.

