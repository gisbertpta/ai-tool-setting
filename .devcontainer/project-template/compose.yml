# Project layer — compose part. Merged on top of .devcontainer/docker-compose.yml.
#
# PATHS: compose resolves every relative path against .devcontainer/ (the folder
# of the first compose file), also the ones written here. Address files of this
# layer via the slot path ./project/..., working repos via ../<repo>/...

# Compose project name → container names <name>-devcontainer-1 / <name>-proxy-1.
# Pick one per project so several projects can run side by side.
name: ai-envelope-myproject

services:
  devcontainer:
    # build:
