# Egress allowlist proxy for the Claude Code sandbox.
# The devcontainer sits on an internal-only network; this proxy is its only way out.
# Blocked requests show up as TCP_DENIED in: docker logs <proxy container>

http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowlist.txt"
acl allowed_domains dstdomain "/etc/squid/allowlist-project.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

# HTTPS only, allowlisted domains only
http_access deny CONNECT !SSL_ports
http_access deny !SSL_ports
http_access allow allowed_domains
http_access deny all

# Pure forwarder: no caching, no request/response rewriting
cache deny all
via off
forwarded_for delete

# Written to files (squid runs as 'proxy' and can't reopen the container's stdout);
# the container CMD tails access.log to stdout.
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 0
pid_filename none
