# this file is GIT-IGNORED and not part of the code-repository
# if the top-level keys are stages (dev/test/prod), the actual environment must
# be given via environment variable (STAGE=dev/test/prod)

local_file_path: data/input/
write_file_path: data/output/
base_table: DATEN_KI..ANF_887_WUK_DOK
doc_storage: s3 # s3 or archivews or local

data:
  doc_intelligence_endpoint: https://api.qa.llm.azure01.dakintra.de/azure-di-layout-v4

database:
  netezza:
    type: netezza
    server: bicc1.prod01.dakintra.de
    port: 5480
    default_catalog:
      read: DBE_DS
      write: DBE_SDB_KI
    driver_type: jdbc
    driver_class_jdbc: org.netezza.Driver
    driver_class_odbc: NetezzaSQL
    driver_loc: nzjdbc3.jar

s3:
  endpoint: https://s3-hh.mauintra.de
  bucket_name: dak-ki-zfw-wm-dev
  verify: /etc/pki/tls/certs/ca-bundle.crt
  s_access_key: S3_ACCESS_KEY
  s_secret_access_key: S3_SECRET_ACCESS_KEY

logging:
  version: 1
  formatters:
    dak:
      format: "%(asctime)s %(levelname)-8s [%(filename)s:%(lineno)d] %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      formatter: dak
    file_handler:
      class: logging.handlers.TimedRotatingFileHandler
      filename: logs/log.log
      when: midnight
      formatter: dak
  root:
    level: DEBUG
    handlers: [console, file_handler]
  disable_existing_loggers: False

app_service:
  host: 0.0.0.0
  port: 33333
  prometheus_metrics_port: 9100
  service_token_valid_hours: 24
  environment: local
  s_secret_key_jwt: APP_SERVICE_SECRET_KEY_JWT
  s_user_jwt: APP_SERVICE_USER_JWT
  s_password_jwt: APP_SERVICE_PW_JWT
  s_user_basicauth: APP_SERVICE_USER_BASICAUTH
  s_pw_basicauth: APP_SERVICE_PW_BASICAUTH

