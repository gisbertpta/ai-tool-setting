# AI sandbox — generic part. Merged on top of it, in this order (see devcontainer.json
# and compose.sh):
#   .generated/compose.yml   generated by initialize.sh: module image as BASE_IMAGE,
#                            module mounts, read-only git config of the working repos
#   project/compose.yml      the project layer
#
# The devcontainer has no direct internet route. All egress goes through the
# 'proxy' service, which only allows proxy/allowlist.txt + the modules' and the
# project's allowlists.
#
# Relative paths resolve against this file's folder (.devcontainer/) — also the
# ones written in project/compose.yml.
# The compose project name ('name:') is set by the project layer.

services:
  devcontainer:
    build:
      # Context is the workspace root so the project Dockerfile can COPY files from
      # working repos. What actually gets sent is limited by project/Dockerfile.dockerignore.
      context: ..
      dockerfile: .devcontainer/project/Dockerfile
      # args.BASE_IMAGE (the last module image) comes from .generated/compose.yml
    command: sleep infinity
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Against runaway processes; override in project/compose.yml if needed
    mem_limit: 8g
    pids_limit: 4096
    environment:
      # Ignore /etc/gitconfig: VS Code Dev Containers writes its credential helper
      # there, which would hand out your HOST git credentials to the agent
      GIT_CONFIG_NOSYSTEM: "1"
      HTTPS_PROXY: http://proxy:3128
      HTTP_PROXY: http://proxy:3128
      https_proxy: http://proxy:3128
      http_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
    volumes:
      - ..:/workspace:cached
      # Read-only: the agent must not be able to edit its own sandbox config,
      # its instructions, or the envelope's git repo (hooks/config would run on the host)
      - ./:/workspace/.devcontainer:ro
      - ../.git:/workspace/.git:ro
      - ../AGENTS.md:/workspace/AGENTS.md:ro
      - ../CLAUDE.md:/workspace/CLAUDE.md:ro
      - ../.dockerignore:/workspace/.dockerignore:ro
      - ../.gitignore:/workspace/.gitignore:ro
      # Git identity
      - ${HOME}/.gitconfig:/home/dev/.gitconfig:ro
      # Shell history, kept across rebuilds (one volume per compose project)
      - shell-history:/home/dev/.local/state/zsh
      # Agent homes/tokens and the working repos' read-only git config come from
      # .generated/compose.yml, project-specific masks from project/compose.yml
    networks:
      - sandbox
    depends_on:
      - proxy

  proxy:
    build:
      context: ./proxy
    volumes:
      # Mounted, not baked in: after editing, 'compose.sh restart proxy' is enough
      - ./proxy/allowlist.txt:/etc/squid/allowlist.txt:ro
      - ./.generated/allowlist-modules.txt:/etc/squid/allowlist-modules.txt:ro
      - ./project/allowlist.txt:/etc/squid/allowlist-project.txt:ro
    networks:
      - sandbox
      - egress
    restart: unless-stopped

volumes:
  shell-history: {}

networks:
  # internal: no gateway — containers here can only talk to each other
  sandbox:
    internal: true
  egress: {}
