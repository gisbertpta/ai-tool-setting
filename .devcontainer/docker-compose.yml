# Claude Code sandbox — generic part. The project layer (.devcontainer/project/compose.yml)
# is merged on top of this file; see devcontainer.json and compose.sh.
#
# The devcontainer has no direct internet route. All egress goes through the
# 'proxy' service, which only allows proxy/allowlist.txt + project/allowlist.txt.
#
# Relative paths resolve against this file's folder (.devcontainer/) — also the
# ones written in project/compose.yml.
# The compose project name ('name:') is set by the project layer.

services:
  devcontainer:
    build:
      # Context is the workspace root so the project Dockerfile can COPY files from
      # working repos. What actually gets sent is limited by project/Dockerfile.dockerignore.
      context: ..
      dockerfile: .devcontainer/project/Dockerfile
      args:
        BASE_IMAGE: ai-envelope-base:latest   # built by initialize.sh
    command: sleep infinity
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HTTPS_PROXY: http://proxy:3128
      HTTP_PROXY: http://proxy:3128
      https_proxy: http://proxy:3128
      http_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
    volumes:
      - ..:/workspace:cached
      # Read-only: the agent must not be able to edit its own sandbox config
      - ./:/workspace/.devcontainer:ro
      - ./.claude:/workspace/.claude:ro
      # Claude home + git identity
      - ${HOME}/.claude:/home/claude/.claude:cached
      - ${HOME}/.claude.json:/home/claude/.claude.json:cached
      - ${HOME}/.gitconfig:/home/claude/.gitconfig:ro
      # Project-specific masks are added in project/compose.yml
    networks:
      - sandbox
    depends_on:
      - proxy

  proxy:
    build:
      context: ./proxy
    volumes:
      # Mounted, not baked in: after editing, 'compose.sh restart proxy' is enough
      - ./proxy/allowlist.txt:/etc/squid/allowlist.txt:ro
      - ./project/allowlist.txt:/etc/squid/allowlist-project.txt:ro
    networks:
      - sandbox
      - egress
    restart: unless-stopped

networks:
  # internal: no gateway — containers here can only talk to each other
  sandbox:
    internal: true
  egress: {}
